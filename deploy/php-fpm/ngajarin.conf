; PHP-FPM pool for Ngajarin. Installed by setup-app.sh as /etc/php/8.4/fpm/pool.d/ngajarin.conf.
; PHP runs as the same user that owns and deploys the code, so storage/ and bootstrap/cache/ are
; writable without permission juggling (the same approach Laravel Forge uses).
[ngajarin]
user = denyfebriawan
group = denyfebriawan

; Nginx (www-data) talks to PHP through this socket.
listen = /run/php/ngajarin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sized for ~1 GB of RAM: at most 4 PHP processes at ~40 MB each.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
; Recycle each process after 500 requests, so small memory leaks never pile up.
pm.max_requests = 500
