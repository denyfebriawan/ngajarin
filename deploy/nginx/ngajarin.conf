# Nginx site for Ngajarin. Installed once by setup-app.sh as /etc/nginx/sites-available/ngajarin;
# certbot then adds the HTTPS parts to that installed copy, so later edits go there, not here.
server {
    listen 80;
    listen [::]:80;
    server_name ngajarin.denyfebriawan.dev;
    root /var/www/ngajarin/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    # Real files (CSS, JS, images) are served directly; everything else goes to Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite's built files have a content hash in their names, so browsers may cache them forever.
    location /build/ {
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Only public/index.php is ever run as PHP.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/ngajarin.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Hide dotfiles such as .env, but keep /.well-known/ for Let's Encrypt.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
